[package]
name = "miaominal-sync"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = ["desktop"]
desktop = ["miaominal-secrets/desktop", "miaominal-storage/desktop"]
mobile = ["miaominal-secrets/mobile", "miaominal-storage/mobile"]

[dependencies]
aes-gcm.workspace = true
anyhow.workspace = true
argon2.workspace = true
base64.workspace = true
log.workspace = true
miaominal-core = { path = "../miaominal-core" }
miaominal-paths = { path = "../miaominal-paths" }
miaominal-secrets = { path = "../miaominal-secrets", default-features = false }
miaominal-settings = { path = "../miaominal-settings", default-features = false }
miaominal-storage = { path = "../miaominal-storage", default-features = false }
rand.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
toml.workspace = true
uuid.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
tempfile.workspace = true
