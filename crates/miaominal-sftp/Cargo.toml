[package]
name = "miaominal-sftp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["desktop"]
desktop = [
    "miaominal-secrets/desktop",
    "miaominal-ssh/desktop",
    "miaominal-storage/desktop",
]
mobile = [
    "miaominal-secrets/mobile",
    "miaominal-ssh/mobile",
    "miaominal-storage/mobile",
]

[dependencies]
anyhow.workspace = true
futures.workspace = true
log.workspace = true
miaominal-core = { path = "../miaominal-core" }
miaominal-secrets = { path = "../miaominal-secrets", default-features = false }
miaominal-ssh = { path = "../miaominal-ssh", default-features = false }
miaominal-storage = { path = "../miaominal-storage", default-features = false }
russh.workspace = true
russh-sftp.workspace = true
tempfile.workspace = true
tokio.workspace = true
