[package]
name = "miaominal-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["desktop"]
desktop = ["miaominal-secrets/desktop", "miaominal-storage/desktop"]
mobile = ["miaominal-secrets/mobile", "miaominal-storage/mobile"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
futures.workspace = true
httparse.workspace = true
log.workspace = true
miaominal-core = { path = "../miaominal-core" }
miaominal-paths = { path = "../miaominal-paths" }
miaominal-secrets = { path = "../miaominal-secrets", default-features = false }
miaominal-storage = { path = "../miaominal-storage", default-features = false }
russh.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "net"] }
tokio-socks.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
