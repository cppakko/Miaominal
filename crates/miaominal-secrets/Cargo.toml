[package]
name = "miaominal-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["desktop"]
# Desktop builds use the operating-system keyring as the default credential
# backend. Mobile builds inject the credential backend from the host process
# and must never link a desktop keyring implementation.
desktop = ["dep:keyring"]
mobile = []

[dependencies]
aes.workspace = true
aes-gcm.workspace = true
anyhow.workspace = true
argon2.workspace = true
base64.workspace = true
keyring = { workspace = true, optional = true }
log.workspace = true
memsafe.workspace = true
miaominal-paths = { path = "../miaominal-paths" }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
zeroize.workspace = true
